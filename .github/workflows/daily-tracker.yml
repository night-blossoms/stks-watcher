name: Daily commodity-stock tracker

on:
  schedule:
    # TEMPORARY one-off: 10:55 IST = 05:25 UTC today, to verify the cache-
    # busting/footer fix on a real scheduled run rather than a manual
    # workflow_dispatch. Revert to 10:20 IST (cron "50 4 * * 1-5") once
    # confirmed.
    - cron: "25 5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python tracker.py

      - name: Commit results
        run: |
          git config user.name "commodity-tracker-bot"
          git config user.email "actions@github.com"
          git add signals_log.csv paper_trades.csv docs/data.json
          [ -d calls ] && git add calls/
          git diff --cached --quiet || git commit -m "Daily tracker run $(date -u +%F)"
          git push
