name: Daily commodity-stock tracker

on:
  schedule:
    # 10:20 IST = 04:50 UTC, Mon-Fri. NSE opens 09:15 IST — this runs after
    # open, but it doesn't matter for data freshness either way: yfinance's
    # daily close for a ticker isn't available until that day's session
    # ends (~15:30 IST), so this is still reacting to the PREVIOUS day's
    # close regardless of whether it runs at 08:45 or 10:20.
    - cron: "50 4 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python tracker.py

      - name: Commit results
        run: |
          git config user.name "commodity-tracker-bot"
          git config user.email "actions@github.com"
          git add signals_log.csv paper_trades.csv docs/data.json
          [ -d calls ] && git add calls/
          git diff --cached --quiet || git commit -m "Daily tracker run $(date -u +%F)"
          git push
